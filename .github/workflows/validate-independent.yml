name: Validate independent Mdyaf build

on:
  push:
    branches:
      - mdyaf-independent
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://xxvqvxugnvhbxrnqepiu.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Export source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mdyaf-independent-source
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
